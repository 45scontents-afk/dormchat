<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dorm Chat AI</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-main: #ffffff;
            --bg-header: rgba(255, 255, 255, 0.8);
            --text-main: #37352f;
            --text-muted: #666666;
            --accent: #10a37f;
            --border: #e5e5e5;
            --ai-bubble: #f7f7f8;
            --user-bubble: #ffffff;
            --input-bg: #ffffff;
            --code-bg: #2d2d2d;
        }

        body.dark-mode {
            --bg-main: #212121;
            --bg-header: rgba(33, 33, 33, 0.8);
            --text-main: #ececec;
            --text-muted: #b4b4b4;
            --accent: #19c37d;
            --border: #424242;
            --ai-bubble: #2f2f2f;
            --user-bubble: #212121;
            --input-bg: #303030;
            --code-bg: #000000;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.2s, color 0.2s; }
        body, html { height: 100%; font-family: 'Pretendard', -apple-system, sans-serif; background: var(--bg-main); color: var(--text-main); overflow: hidden; }

        #container { display: flex; flex-direction: column; height: 100vh; max-width: 900px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); position: relative; }

        header { 
            padding: 15px 20px; border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-header); backdrop-filter: blur(10px); z-index: 100;
        }
        header h1 { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.5px; }
        
        .header-controls { display: flex; gap: 12px; align-items: center; }
        .theme-btn { 
            background: none; border: 1px solid var(--border); color: var(--text-main); 
            padding: 6px 12px; border-radius: 20px; cursor: pointer; font-size: 0.8rem;
            display: flex; align-items: center; gap: 6px; font-weight: 500;
        }
        .theme-btn:hover { background: var(--ai-bubble); }

        #chat-window { flex: 1; overflow-y: auto; padding: 20px 0; scroll-behavior: smooth; }
        .message-row { padding: 24px 20px; border-bottom: 1px solid var(--border); display: flex; gap: 16px; animation: fadeIn 0.3s ease-out; }
        .message-row.user { background: var(--user-bubble); }
        .message-row.ai { background: var(--ai-bubble); }

        .avatar { width: 30px; height: 30px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; flex-shrink: 0; }
        .user .avatar { background: #5436da; color: white; }
        .ai .avatar { background: var(--accent); color: white; }

        .content { flex: 1; font-size: 1rem; line-height: 1.65; word-break: break-word; }
        .content p { margin-bottom: 0.8rem; }
        .content p:last-child { margin-bottom: 0; }
        .content pre { background: var(--code-bg); color: #efefef; padding: 16px; border-radius: 10px; overflow-x: auto; margin: 12px 0; }
        .content code { font-family: 'Fira Code', monospace; background: rgba(120,120,120,0.15); padding: 2px 5px; border-radius: 4px; font-size: 0.9em; }

        .input-outer { padding: 20px; background: linear-gradient(transparent, var(--bg-main) 40%); }
        .input-box { 
            max-width: 800px; margin: 0 auto; display: flex; align-items: flex-end; 
            border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; 
            background: var(--input-bg); box-shadow: 0 4px 20px rgba(0,0,0,0.06);
        }
        
        textarea { 
            flex: 1; border: none; outline: none; resize: none; background: transparent;
            color: var(--text-main); padding: 4px 0; font-size: 1rem; max-height: 200px; min-height: 24px;
        }

        #send-btn { 
            background: var(--accent); color: white; border: none; width: 34px; height: 34px; 
            border-radius: 10px; cursor: pointer; margin-left: 12px; display: flex; align-items: center; justify-content: center;
            transition: transform 0.1s, opacity 0.2s;
        }
        #send-btn:hover:not(:disabled) { transform: scale(1.05); }
        #send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

        .typing { font-size: 0.8rem; color: var(--text-muted); margin-top: 10px; text-align: center; height: 20px; opacity: 0; transition: opacity 0.2s; }
        .typing.visible { opacity: 1; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        
        /* 스크롤바 커스텀 */
        #chat-window::-webkit-scrollbar { width: 6px; }
        #chat-window::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; }
    </style>
</head>
<body>

<div id="container">
    <header>
        <h1>Dorm Chat AI</h1>
        <div class="header-controls">
            <button class="theme-btn" id="theme-toggle">
                <i class="fa-solid fa-moon"></i> <span id="theme-text">Dark Mode</span>
            </button>
            <i class="fa-solid fa-rotate-right" style="cursor: pointer; color: var(--text-muted); font-size: 0.9rem;" onclick="location.reload()"></i>
        </div>
    </header>

    <div id="chat-window">
        <div class="message-row ai">
            <div class="avatar"><i class="fa-solid fa-robot"></i></div>
            <div class="content">반갑습니다! 기숙사 생활 도우미입니다. 궁금하신 내용을 입력해 주세요.</div>
        </div>
    </div>

    <div class="input-outer">
        <div id="typing-indicator" class="typing">AI가 생각 중입니다...</div>
        <div class="input-box">
            <textarea id="user-input" placeholder="메시지를 입력하세요..." rows="1"></textarea>
            <button id="send-btn" disabled><i class="fa-solid fa-arrow-up"></i></button>
        </div>
    </div>
</div>

<script>
    const chatWindow = document.getElementById('chat-window');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');
    const themeToggle = document.getElementById('theme-toggle');
    const webhookUrl = 'https://n8n.bonolabs.dedyn.io/webhook/dorm-chat';

    // 1. 테마 관리
    function setTheme(isDark) {
        if (isDark) {
            document.body.classList.add('dark-mode');
            themeToggle.innerHTML = '<i class="fa-solid fa-sun"></i> <span>Light Mode</span>';
            localStorage.setItem('dorm-theme', 'dark');
        } else {
            document.body.classList.remove('dark-mode');
            themeToggle.innerHTML = '<i class="fa-solid fa-moon"></i> <span>Dark Mode</span>';
            localStorage.setItem('dorm-theme', 'light');
        }
    }

    themeToggle.addEventListener('click', () => {
        setTheme(!document.body.classList.contains('dark-mode'));
    });

    if (localStorage.getItem('dorm-theme') === 'dark') setTheme(true);

    // 2. 입력창 자동 높이
    userInput.addEventListener('input', () => {
        userInput.style.height = 'auto';
        userInput.style.height = userInput.scrollHeight + 'px';
        sendBtn.disabled = userInput.value.trim() === '';
    });

    // 3. 메시지 추가
    function appendMessage(sender, text) {
        const row = document.createElement('div');
        row.className = `message-row ${sender}`;
        const avatarIcon = sender === 'user' ? 'fa-user' : 'fa-robot';
        
        // 마크다운 처리 (AI 답변만)
        const htmlContent = sender === 'ai' ? marked.parse(text) : `<p>${text.replace(/\n/g, '<br>')}</p>`;

        row.innerHTML = `
            <div class="avatar"><i class="fa-solid ${avatarIcon}"></i></div>
            <div class="content">${htmlContent}</div>
        `;
        chatWindow.appendChild(row);
        chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
    }

    // 4. 전송 로직
    async function sendMessage() {
        const message = userInput.value.trim();
        if (!message) return;

        appendMessage('user', message);
        userInput.value = '';
        userInput.style.height = 'auto';
        sendBtn.disabled = true;
        typingIndicator.classList.add('visible');

        try {
            const response = await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ 
                    content: message, 
                    timestamp: new Date().toISOString(),
                    source: 'web_ui'
                })
            });

            if (!response.ok) throw new Error();

            const data = await response.json();
            // n8n의 응답 구조에 따라 data.output 등을 적절히 선택
            const aiReply = data.output || data.response || data.text || "답변을 가져오지 못했습니다.";
            
            typingIndicator.classList.remove('visible');
            appendMessage('ai', aiReply);
        } catch (error) {
            typingIndicator.classList.remove('visible');
            appendMessage('ai', "⚠️ **서버 연결에 실패했습니다.** n8n 워크플로우 상태를 확인해 주세요.");
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
</script>

</body>
</html>
